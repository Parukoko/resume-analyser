services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://app:8000
      PUBLIC_API_BASE_URL: http://localhost:8000
      API_REQUEST_TIMEOUT: "180"
    volumes:
      - ./data:/app/data
    depends_on:
      - app

  # Optional: a local LLM instead of the default (Gemini free tier). Not started
  # by default. Start it with:
  #   docker compose --profile local-llm up -d
  # and set in .env: LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=qwen3:8b,
  # LLM_API_KEY=ollama, LLM_TIMEOUT=1200 (CPU-only inference is slow — see
  # README "Alternative: local LLM (Ollama)" and "Troubleshooting").
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
