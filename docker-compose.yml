services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      target: ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://app:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_REQUEST_TIMEOUT: "180"
    volumes:
      - ./data:/app/data
    depends_on:
      - app

  # docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]

  # docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
